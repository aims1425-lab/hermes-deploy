# Minimal local NGINX reverse-proxy example for hermes-gateway.
# Replace <your-domain.example> and <gateway-port> with your values.

upstream hermes_gateway {
    server 127.0.0.1:<gateway-port>;
}

server {
    listen 80;
    server_name <your-domain.example>;

    location / {
        proxy_pass http://hermes_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
